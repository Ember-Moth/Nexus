name: Control plane checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client redis-server
      - name: Install locked Python dependencies
        run: uv sync --locked
      - name: Lint and architecture tests
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -m 'not integration' -q
      - name: Rust relay protocol checks
        working-directory: src/relay
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Isolated PostgreSQL and Redis integration tests
        run: uv run python scripts/run_integration.py -q
      - name: Build distributions
        run: uv build
