name: Container images

# Builds the three deployable images (deploy/images/*.Dockerfile). Pull requests build them for
# amd64 without pushing; main and version tags build amd64 and arm64 natively, push each by
# digest to GHCR and publish one multi-arch tag set. The Helm charts are linted and rendered too.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  charts:
    name: Helm charts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Lint and render
        run: |
          helm lint deploy/helm/nexus-data -f deploy/smoke/values-data.yaml
          helm lint deploy/helm/nexus -f deploy/smoke/values-app.yaml
          helm template nexus-data deploy/helm/nexus-data -n nexus > /dev/null
          helm template nexus deploy/helm/nexus -n nexus -f deploy/examples/values-production.yaml > /dev/null
          helm template nexus deploy/helm/nexus -n nexus -f deploy/smoke/values-app.yaml \
            --set relay.clusterId=00000000-0000-4000-8000-000000000001 --set relay.replicas=2 \
            > /dev/null

  build:
    name: ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [control-plane, relay, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
        exclude:
          # Pull requests only check that the images build.
          - platform: ${{ github.event_name == 'pull_request' && 'linux/arm64' || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "repository=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/nexus-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - name: Build${{ github.event_name != 'pull_request' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: >-
            ${{ github.event_name == 'pull_request'
              && 'type=cacheonly'
              || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.repository) }}
      - name: Keep the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: ${{ matrix.image }} manifest
    if: github.event_name != 'pull_request'
    needs: [build, charts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [control-plane, relay, web]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "repository=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/nexus-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Publish the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.name.outputs.repository }}@sha256:%s ' *)
      - name: Show the published digest
        run: docker buildx imagetools inspect "${{ steps.name.outputs.repository }}:sha-${{ github.sha }}"
