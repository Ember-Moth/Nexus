# External Secrets Operator (v2, external-secrets.io/v1) example: every Secret the nexus and
# nexus-data charts reference, read from HashiCorp Vault KV v2 under nexus/production/*.
# Swap the SecretStore provider for AWS Secrets Manager, GCP Secret Manager, 1Password, etc.
# The charts never see these values; only the operator writes the Kubernetes Secrets.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: nexus-vault
  namespace: nexus
spec:
  provider:
    vault:
      server: https://vault.example.com
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: nexus-production
          serviceAccountRef:
            name: external-secrets-nexus
---
# PostgreSQL logins: basic-auth Secrets, also used by CloudNativePG managed roles. The
# cnpg.io/reload label makes CloudNativePG apply a rotated password without a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-db-api
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target:
    name: nexus-db-api
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: "true"}
      data:
        username: nexus_api
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: nexus/production/postgres/nexus_api, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-db-worker
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target:
    name: nexus-db-worker
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: "true"}
      data:
        username: nexus_worker
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: nexus/production/postgres/nexus_worker, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-db-migrator
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target:
    name: nexus-db-migrator
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: {cnpg.io/reload: "true"}
      data:
        username: nexus_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: nexus/production/postgres/nexus_migrator, property: password}
---
# Application encryption key ring. During a rotation the previous keys stay listed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-encryption
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target: {name: nexus-encryption}
  data:
    - secretKey: encryption-key
      remoteRef: {key: nexus/production/encryption, property: current_key}
    - secretKey: encryption-key-version
      remoteRef: {key: nexus/production/encryption, property: current_version}
    - secretKey: previous-encryption-keys
      remoteRef: {key: nexus/production/encryption, property: previous_keys_json}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-auth-proxy
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target: {name: nexus-auth-proxy}
  data:
    - secretKey: secret
      remoteRef: {key: nexus/production/bff, property: auth_proxy_secret}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-redis
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target: {name: nexus-redis}
  data:
    - secretKey: password
      remoteRef: {key: nexus/production/redis, property: password}
---
# The gateway cluster's Curve25519 private key. Back it up outside the cluster: a restored
# database is useless to the relay without it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-relay-cluster
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target: {name: nexus-relay-cluster}
  data:
    - secretKey: private-key
      remoteRef: {key: nexus/production/relay-cluster, property: private_key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-integrations
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target: {name: nexus-integrations}
  data:
    - secretKey: smtp-password
      remoteRef: {key: nexus/production/mail, property: smtp_password}
    - secretKey: turnstile-secret-key
      remoteRef: {key: nexus/production/turnstile, property: secret_key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-deployer
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target: {name: nexus-deployer}
  data:
    - secretKey: login
      remoteRef: {key: nexus/production/deployer, property: login}
    - secretKey: password
      remoteRef: {key: nexus/production/deployer, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-backup-s3
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target: {name: nexus-backup-s3}
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: {key: nexus/production/backup-s3, property: access_key_id}
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: {key: nexus/production/backup-s3, property: secret_access_key}
---
# Optional: keep relay node logins in Vault too, so a fresh cluster restores them instead of
# the relay-node Job generating new passwords. One per ordinal (here node 0).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-relay-node-0
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef: {name: nexus-vault, kind: SecretStore}
  target: {name: nexus-relay-node-0}
  data:
    - secretKey: username
      remoteRef: {key: nexus/production/relay-nodes/0, property: username}
    - secretKey: password
      remoteRef: {key: nexus/production/relay-nodes/0, property: password}
    - secretKey: node-id
      remoteRef: {key: nexus/production/relay-nodes/0, property: node_id}
