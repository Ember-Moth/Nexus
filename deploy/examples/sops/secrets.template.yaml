# Template for the Secrets the charts reference. Fill in, encrypt, delete the plaintext:
#   cp secrets.template.yaml secrets.enc.yaml && $EDITOR secrets.enc.yaml
#   sops --encrypt --in-place secrets.enc.yaml
#   sops --decrypt secrets.enc.yaml | kubectl apply -f -      (or Flux with SOPS decryption)
# Generate values with:
#   openssl rand -hex 32                                   PostgreSQL and Redis passwords
#   python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
#                                                          application encryption key
#   openssl rand -base64 33                                BFF shared secret
#   python3 -c 'import base64,os;print(base64.b64encode(os.urandom(32)).decode())'
#                                                          relay cluster private key
apiVersion: v1
kind: Secret
metadata: {name: nexus-db-api, namespace: nexus, labels: {cnpg.io/reload: "true"}}
type: kubernetes.io/basic-auth
stringData: {username: nexus_api, password: REPLACE_ME}
---
apiVersion: v1
kind: Secret
metadata: {name: nexus-db-worker, namespace: nexus, labels: {cnpg.io/reload: "true"}}
type: kubernetes.io/basic-auth
stringData: {username: nexus_worker, password: REPLACE_ME}
---
apiVersion: v1
kind: Secret
metadata: {name: nexus-db-migrator, namespace: nexus, labels: {cnpg.io/reload: "true"}}
type: kubernetes.io/basic-auth
stringData: {username: nexus_migrator, password: REPLACE_ME}
---
apiVersion: v1
kind: Secret
metadata: {name: nexus-encryption, namespace: nexus}
stringData:
  encryption-key: REPLACE_ME
  encryption-key-version: "1"
  # previous-encryption-keys: '{"1": "<old key>"}'   while ciphertexts of version 1 remain
---
apiVersion: v1
kind: Secret
metadata: {name: nexus-auth-proxy, namespace: nexus}
stringData: {secret: REPLACE_ME}
---
apiVersion: v1
kind: Secret
metadata: {name: nexus-redis, namespace: nexus}
stringData: {password: REPLACE_ME}
---
apiVersion: v1
kind: Secret
metadata: {name: nexus-relay-cluster, namespace: nexus}
stringData: {private-key: REPLACE_ME}
---
apiVersion: v1
kind: Secret
metadata: {name: nexus-integrations, namespace: nexus}
stringData:
  smtp-password: REPLACE_ME
  turnstile-secret-key: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata: {name: nexus-deployer, namespace: nexus}
stringData: {login: deployer, password: REPLACE_ME}
---
apiVersion: v1
kind: Secret
metadata: {name: nexus-backup-s3, namespace: nexus}
stringData: {ACCESS_KEY_ID: REPLACE_ME, ACCESS_SECRET_KEY: REPLACE_ME}
