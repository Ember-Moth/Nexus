# Example production values for the nexus chart (single k3s node to start).
images:
  controlPlane: {repository: ghcr.io/herta-network/nexus-control-plane, digest: "sha256:..."}
  relay: {repository: ghcr.io/herta-network/nexus-relay, digest: "sha256:..."}
  web: {repository: ghcr.io/herta-network/nexus-web, digest: "sha256:..."}
hosts:
  api: api.nexus.example.com
  console: console.nexus.example.com
  relay: relay.nexus.example.com
ingress:
  clusterIssuer: letsencrypt
# Export files; credentials in the nexus-app-r2 Secret (docs/deployment.md#对象存储cloudflare-r2).
objectStorage:
  endpointURL: https://ACCOUNT_ID.r2.cloudflarestorage.com
relay:
  # Set after POST /api/v1/gateway-clusters; then raise replicas (docs/deployment.md).
  clusterId: ""
  replicas: 0
policy:
  # Mounted into the import Job only; the files below are its keys (deploy/examples/*secrets*).
  secrets: nexus-policy-secrets
  groups:
    # Initial values for the setup wizard; it must run after this import to pick them up.
    # Payment providers notify api_url; payments stay unavailable without it.
    identity.site_policy:
      mode: initial
      values:
        site_name: Nexus
        console_url: "https://console.nexus.example.com"
        api_url: "https://api.nexus.example.com"
    # Managed: the console shows these read-only. Secrets are references, never values.
    identity.mail_policy:
      mode: managed
      values:
        provider: smtp
        sender: nexus@example.com
        smtp:
          host: smtp.example.com
          port: 587
          security: starttls
          username: nexus
          password: {file: /etc/nexus/policy-secrets/smtp-password}
    # The hostname defaults to the console host.
    identity.turnstile_policy:
      mode: managed
      values:
        site_key: 0x4AAAAAAA...
        secret_key: {file: /etc/nexus/policy-secrets/turnstile-secret-key}
    # Chosen before the first account, price or channel exists; later changes return 409.
    billing.policy:
      mode: initial
      values: {currency: USD}
networkPolicy:
  monitoring:
    namespaceLabels: {kubernetes.io/metadata.name: monitoring}
    podLabels: {app.kubernetes.io/name: prometheus}
