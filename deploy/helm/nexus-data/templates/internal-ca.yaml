{{- if .Values.internalCA.enabled }}
# Namespaced CA for in-cluster TLS: self-signed root -> CA Issuer.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.internalCA.name }}-root
  labels:
    {{- include "nexus-data.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.internalCA.name }}
  labels:
    {{- include "nexus-data.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: Nexus internal CA ({{ .Release.Namespace }})
  secretName: {{ .Values.internalCA.name }}
  duration: 87600h
  renewBefore: 8760h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef:
    kind: Issuer
    name: {{ .Values.internalCA.name }}-root
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.internalCA.name }}
  labels:
    {{- include "nexus-data.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.internalCA.name }}
{{- end }}
