{{- if .Values.redis.enabled }}
{{- $redis := .Values.redis }}
{{- $ns := .Release.Namespace }}
# Redis holds configuration replicas, rate-limit windows, leases and heartbeats. PostgreSQL is
# authoritative for all of it, so the instance runs without persistence; after a restart new
# admissions under rate-limit policies wait out a 60 s recovery window (docs/plane-protocol.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-redis
  labels:
    {{- include "nexus-data.labels" . | nindent 4 }}
    app.kubernetes.io/name: nexus-redis
data:
  redis.conf: |
    bind * -::*
    port 0
    tls-port 6379
    tls-cert-file /tls/tls.crt
    tls-key-file /tls/tls.key
    tls-ca-cert-file /tls/ca.crt
    tls-auth-clients no
    tls-protocols "TLSv1.2 TLSv1.3"
    # Rate limits and leases must never be dropped to make room: fail writes instead.
    maxmemory {{ $redis.maxmemory }}
    maxmemory-policy noeviction
    save ""
    appendonly no
    dir /data
    # requirepass, written from the Secret at start-up.
    include /run/redis/auth.conf
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $redis.tls.secretName }}
  labels:
    {{- include "nexus-data.labels" . | nindent 4 }}
spec:
  secretName: {{ $redis.tls.secretName }}
  duration: {{ $redis.tls.duration }}
  renewBefore: {{ $redis.tls.renewBefore }}
  dnsNames:
    - nexus-redis
    - nexus-redis.{{ $ns }}
    - nexus-redis.{{ $ns }}.svc
    - nexus-redis.{{ $ns }}.svc.cluster.local
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef:
    kind: Issuer
    name: {{ .Values.internalCA.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-redis
  labels:
    {{- include "nexus-data.labels" . | nindent 4 }}
    app.kubernetes.io/name: nexus-redis
spec:
  replicas: 1
  # Never two instances at once: clients must see a single counter store.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: nexus-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: nexus
      annotations:
        checksum/config: {{ .Values.redis | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: {{ $redis.image }}
          command:
            - sh
            - -c
            - |
              umask 077
              printf 'requirepass "%s"\n' "$REDIS_PASSWORD" > /run/redis/auth.conf
              unset REDIS_PASSWORD
              exec redis-server /etc/redis/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $redis.passwordSecret }}, key: password}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: {{ $redis.passwordSecret }}, key: password}
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: [sh, -c, "redis-cli --tls --cacert /tls/ca.crt -h 127.0.0.1 ping | grep -q PONG"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, "redis-cli --tls --cacert /tls/ca.crt -h 127.0.0.1 ping | grep -q PONG"]
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml $redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/redis, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: auth, mountPath: /run/redis}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: nexus-redis}
        - name: tls
          secret:
            secretName: {{ $redis.tls.secretName }}
            defaultMode: 0440
        - name: auth
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: data
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-redis
  labels:
    {{- include "nexus-data.labels" . | nindent 4 }}
    app.kubernetes.io/name: nexus-redis
spec:
  selector: {app.kubernetes.io/name: nexus-redis, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
{{- end }}
