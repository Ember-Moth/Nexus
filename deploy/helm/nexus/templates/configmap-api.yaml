{{- /* Layer 2: API startup parameters. Derived keys come last and win. */}}
{{- $data := mustMergeOverwrite (deepCopy .Values.config.controlPlane) (deepCopy .Values.config.api) (dict "NEXUS_HOST" "0.0.0.0" "NEXUS_PORT" "8000") }}
{{- if .Values.objectStorage.enabled }}
{{- $_ := set $data "NEXUS_OBJECT_STORAGE_ENDPOINT_URL" .Values.objectStorage.endpointURL }}
{{- $_ := set $data "NEXUS_OBJECT_STORAGE_BUCKET" .Values.objectStorage.bucket }}
{{- $_ := set $data "NEXUS_OBJECT_STORAGE_REGION" .Values.objectStorage.region }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexus.fullname" . }}-api
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
