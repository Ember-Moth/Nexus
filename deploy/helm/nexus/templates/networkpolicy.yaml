{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "nexus.fullname" . }}
{{- $traefik := .Values.networkPolicy.ingressController }}
{{- $monitoring := .Values.networkPolicy.monitoring }}
# Nothing reaches a Nexus pod unless a policy below allows it. Database and Redis access is
# enforced on the server side by the nexus-data chart (only labelled clients get in).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexus.selector" (list . "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $traefik.namespace }}}
          podSelector:
            matchLabels: {{- toYaml $traefik.podLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "nexus.selector" (list . "web") | nindent 14 }}
        - podSelector:
            matchLabels: {nexus.io/api-client: "true", app.kubernetes.io/instance: {{ .Release.Name }}}
        {{- if or $monitoring.namespaceLabels $monitoring.podLabels }}
        - namespaceSelector:
            matchLabels: {{- toYaml $monitoring.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml $monitoring.podLabels | nindent 14 }}
        {{- end }}
      ports:
        - {port: 8000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexus.selector" (list . "web") | nindent 6 }}
  policyTypes: {{ ternary "[Ingress, Egress]" "[Ingress]" .Values.networkPolicy.restrictWebEgress }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $traefik.namespace }}}
          podSelector:
            matchLabels: {{- toYaml $traefik.podLabels | nindent 14 }}
      ports:
        - {port: 3000, protocol: TCP}
  {{- if .Values.networkPolicy.restrictWebEgress }}
  # The BFF only talks to the API (and DNS); it has no database or Redis access at all.
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "nexus.selector" (list . "api") | nindent 14 }}
      ports:
        - {port: 8000, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
  {{- end }}
{{- if .Values.relay.clusterId }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-relay
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nexus.selector" (list . "relay") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Client traffic only through Traefik.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $traefik.namespace }}}
          podSelector:
            matchLabels: {{- toYaml $traefik.podLabels | nindent 14 }}
      ports:
        - {port: 8081, protocol: TCP}
    {{- if or $monitoring.namespaceLabels $monitoring.podLabels }}
    # The unauthenticated metrics listener: Prometheus only.
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $monitoring.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels: {{- toYaml $monitoring.podLabels | nindent 14 }}
      ports:
        - {port: 9464, protocol: TCP}
    {{- end }}
{{- end }}
{{- end }}
