{{- /*
Layer 3: business policy. policy.groups becomes the policy file that `nexus settings import
--file` writes into the module policy tables (docs/operations.md#策略文件导入), in a
pre-install / pre-upgrade hook right after the migration, so managed values are in place before
any pod rolls. The importer validates every group first and writes nothing if one is invalid;
the release then stops. The application never reads or writes Kubernetes objects.
*/}}
{{- if and .Values.policy.enabled .Values.policy.groups }}
{{- $known := list "identity.auth_policy" "billing.policy" "reporting.export_policy" "catalog.quota_defaults" "publication.cluster_defaults" }}
{{- range $name, $group := .Values.policy.groups }}
{{- if not (has $name $known) }}
{{- fail (printf "policy.groups.%s: unknown policy group (one of %s)" $name (join ", " $known)) }}
{{- end }}
{{- if not (has $group.mode (list "initial" "managed")) }}
{{- fail (printf "policy.groups.%s.mode must be initial or managed" $name) }}
{{- end }}
{{- end }}
{{- $fullname := include "nexus.fullname" . }}
{{- $document := dict "version" 1 "groups" .Values.policy.groups }}
{{- $env := mustMergeOverwrite (deepCopy .Values.config.controlPlane) (deepCopy .Values.config.api) }}
{{- include "nexus.objectStorageConfig" (list . $env) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-policy
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  policy.yaml: |
    {{- toYaml $document | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-policy-import
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    # After migrate (0): the importer requires the current schema revision.
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
    checksum/policy: {{ toYaml $document | sha256sum }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.hooks.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.hooks.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "nexus.selector" (list . "policy") | nindent 8 }}
        nexus.io/postgres-client: "true"
    spec:
      {{- include "nexus.hookPod" . | nindent 6 }}
      containers:
        - name: import
          image: {{ include "nexus.image" (list . .Values.images.controlPlane) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - settings
            - import
            - --file
            - /etc/nexus/policy/policy.yaml
            {{- if .Values.policy.dryRun }}
            - --dry-run
            {{- end }}
          # Runs as the API (nexus_api role) and only talks to PostgreSQL. The API ConfigMap does
          # not exist yet before the first install, so its values are set here directly.
          env:
            {{- range $key, $value := $env }}
            - {name: {{ $key }}, value: {{ $value | toString | quote }}}
            {{- end }}
            {{- include "nexus.databaseEnv" (list . "api" "NEXUS_DATABASE_URL") | nindent 12 }}
            {{- include "nexus.redisEnv" (list . "NEXUS_REDIS_URL" "python") | nindent 12 }}
            {{- include "nexus.controlPlaneSecretEnv" (list . "api") | nindent 12 }}
          resources:
            {{- toYaml .Values.hooks.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: policy, mountPath: /etc/nexus/policy, readOnly: true}
            {{- include "nexus.caMounts" . | nindent 12 }}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: policy
          configMap:
            name: {{ $fullname }}-policy
        {{- include "nexus.caVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
{{- end }}
