apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus.fullname" . }}-web
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "nexus.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus.selector" (list . "web") | nindent 8 }}
        app.kubernetes.io/part-of: nexus
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-web.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "nexus.pullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "nexus.image" (list . .Values.images.web) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - {name: http, containerPort: 3000}
          envFrom:
            - configMapRef:
                name: {{ include "nexus.fullname" . }}-web
          env:
            - name: NEXUS_AUTH_PROXY_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.authProxy }}, key: secret}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          readinessProbe:
            # A public page rendered by the server; no session needed.
            httpGet: {path: /login, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            preStop:
              sleep: {seconds: {{ .Values.web.preStopSeconds }}}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # Next.js writes its fetch and image caches here.
            - {name: cache, mountPath: /app/.next/cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "nexus.selector" (list . "web") | nindent 14 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexus.fullname" . }}-web
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "nexus.selector" (list . "web") | nindent 4 }}
  ports:
    - {name: http, port: 3000, targetPort: http}
{{- if gt (int .Values.web.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nexus.fullname" . }}-web
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "nexus.selector" (list . "web") | nindent 6 }}
{{- end }}
