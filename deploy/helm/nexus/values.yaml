# Nexus application chart. Configuration is split into three layers (docs/deployment.md#三层配置):
#   1. secrets.*  names of Kubernetes Secrets. The chart only references them; it never renders
#                 a secret value. Create them with External Secrets, SOPS or by hand.
#   2. config.*   non-secret startup parameters and per-node resource limits, rendered into one
#                 ConfigMap per component and injected with envFrom. A change rolls the
#                 component's pods (checksum annotation).
#   3. policy.*   business policy, imported into the database policy tables by a post-install /
#                 post-upgrade Job. The database is authoritative; see policy.groups.

nameOverride: ""
fullnameOverride: ""

images:
  # tag defaults to the chart appVersion; a digest, when set, wins over the tag.
  controlPlane:
    repository: ghcr.io/herta-network/nexus-control-plane
    tag: ""
    digest: ""
  relay:
    repository: ghcr.io/herta-network/nexus-relay
    tag: ""
    digest: ""
  web:
    repository: ghcr.io/herta-network/nexus-web
    tag: ""
    digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Public host names. TLS terminates at Traefik with a cert-manager certificate.
hosts:
  api: api.example.com
  console: console.example.com
  relay: relay.example.com

ingress:
  enabled: true
  className: traefik
  # cert-manager ClusterIssuer that signs the certificate for all three hosts.
  clusterIssuer: letsencrypt
  # Strict-Transport-Security on every response; set 0 to disable.
  hstsSeconds: 31536000
  annotations: {}

# ---------------------------------------------------------------------------------------------
# Layer 1: Secrets (names and keys only)
# ---------------------------------------------------------------------------------------------
secrets:
  # Application encryption key ring. Keys:
  #   encryption-key            URL-safe base64 of 32 random bytes (current key; its version is
  #                             config.controlPlane.NEXUS_ENCRYPTION_KEY_VERSION)
  #   previous-encryption-keys  optional JSON {"<version>": "<key>"} of keys still needed to read
  #                             older ciphertexts
  encryption: nexus-encryption
  # Key "secret": at least 32 random characters, shared by the BFF and the API.
  authProxy: nexus-auth-proxy
  # Key "password": Redis AUTH password (URL-safe characters only).
  redis: nexus-redis
  # Key "private-key": base64 of the gateway cluster's 32-byte Curve25519 private key.
  relayCluster: nexus-relay-cluster
  # Optional keys: smtp-password, resend-api-key, cloudflare-email-api-token, turnstile-secret-key.
  integrations: nexus-integrations
  # Platform administrator the relay-node Job signs in as to register principals.
  # Keys: login, password. Not needed while relay.replicas is 0.
  deployer: nexus-deployer
  # PostgreSQL logins, one basic-auth Secret per role (keys username, password; the same Secrets
  # are the CloudNativePG managed-role password secrets). Passwords must be URL-safe
  # (for example `openssl rand -hex 32`). Set urlKey to read a complete connection URL instead.
  database:
    api: {name: nexus-db-api, urlKey: ""}
    worker: {name: nexus-db-worker, urlKey: ""}
    migrator: {name: nexus-db-migrator, urlKey: ""}
    # Administrator (superuser, or CREATEROLE + CREATEDB) used only by the provisioning and
    # relay-node Jobs. Empty means "<clusterName>-superuser" from CloudNativePG.
    admin: {name: "", urlKey: ""}
  # Relay node logins are created by the relay-node Job as "<prefix>-<ordinal>" with keys
  # username, password, node-id, unless they already exist (for example from External Secrets).
  relayNodePrefix: nexus-relay-node

# ---------------------------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------------------------
postgresql:
  # cloudnative-pg: the nexus-data chart's cluster in this namespace. external: a managed service.
  mode: cloudnative-pg
  clusterName: nexus-pg
  # Defaults to "<clusterName>-rw.<namespace>.svc" in cloudnative-pg mode.
  host: ""
  port: 5432
  database: nexus
  # Database name the administrator connects to for provisioning.
  maintenanceDatabase: postgres
  # Production requires verify-full (RuntimeSettings rejects anything else).
  sslmode: verify-full
  # CA that signs the server certificate, mounted at /etc/nexus/postgres-ca/ca.crt. In
  # cloudnative-pg mode it defaults to the Secret "<clusterName>-ca". For a managed service set
  # configMap (for example the provider's CA bundle).
  ca:
    secret: ""
    configMap: ""
    key: ca.crt

redis:
  # Defaults to "nexus-redis.<namespace>.svc" (the nexus-data chart).
  host: ""
  port: 6379
  db: 0
  # TLS is required in production. The CA comes from this Secret's ca.crt (the nexus-data
  # chart's cert-manager certificate) or from caConfigMap for a managed Redis.
  tls: true
  caSecret: nexus-redis-tls
  caConfigMap: ""

# Application object storage, S3 API (Cloudflare R2): export files under exports/. Required: the
# API signs short-lived download URLs and the Worker uploads and deletes the files. Browsers
# download from endpointURL directly, so it must be reachable from them. A bucket of its own,
# separate from the backup bucket, with its own R2 API token (Object Read & Write on this bucket
# only) and a lifecycle rule on exports/ as a safety net (docs/deployment.md). Injected into the
# API, the Worker and the policy Job as
#   ConfigMap  NEXUS_OBJECT_STORAGE_ENDPOINT_URL, NEXUS_OBJECT_STORAGE_BUCKET,
#              NEXUS_OBJECT_STORAGE_REGION
#   Secret     NEXUS_OBJECT_STORAGE_ACCESS_KEY_ID, NEXUS_OBJECT_STORAGE_SECRET_ACCESS_KEY
#              (keys ACCESS_KEY_ID and ACCESS_SECRET_KEY of credentialsSecret)
objectStorage:
  # https://<account_id>.r2.cloudflarestorage.com (with a jurisdiction: <account_id>.eu.r2...).
  endpointURL: ""
  bucket: nexus-app
  region: auto
  credentialsSecret: nexus-app-r2

# ---------------------------------------------------------------------------------------------
# Layer 2: ConfigMaps. Non-secret startup parameters and per-node resource limits, one ConfigMap
# per component. The chart adds the derived keys listed in docs/deployment.md (URLs, listen
# addresses, CA paths). Business policy does not belong here; see policy.
# ---------------------------------------------------------------------------------------------
config:
  # Shared by the API, the Worker and the migration/policy Jobs.
  controlPlane:
    NEXUS_ENVIRONMENT: production
    NEXUS_LOG_LEVEL: info
    NEXUS_REDIS_NAMESPACE: "nexus:v1"
    # Version of the key in secrets.encryption; change both in one release when rotating.
    NEXUS_ENCRYPTION_KEY_VERSION: "1"
    NEXUS_DEPENDENCY_TIMEOUT: "3"
    NEXUS_SHUTDOWN_TIMEOUT: "10"
    # Identity mail transport (credentials are in secrets.integrations).
    # NEXUS_MAIL_PROVIDER: smtp
    # NEXUS_MAIL_FROM: nexus@example.com
    # NEXUS_SMTP_HOST: smtp.example.com
    # NEXUS_SMTP_PORT: "587"
    # NEXUS_SMTP_SECURITY: starttls
    # NEXUS_SMTP_USERNAME: nexus
    # NEXUS_CLOUDFLARE_EMAIL_ACCOUNT_ID: ""
    # NEXUS_TURNSTILE_SITE_KEY: ""
    # NEXUS_TURNSTILE_HOSTNAME: console.example.com
    # Public API origin for payment notifications (HTTPS in production). Payers return to the
    # console URL of the site policy (identity.site_policy), set in the setup wizard.
    # NEXUS_PAYMENT_PUBLIC_BASE_URL: https://api.example.com
  api:
    NEXUS_DB_POOL_SIZE: "5"
    NEXUS_DB_MAX_OVERFLOW: "0"
    NEXUS_LOGIN_HASH_CONCURRENCY: "2"
    NEXUS_ACCOUNT_HASH_CONCURRENCY: "1"
    NEXUS_HASH_QUEUE_TIMEOUT_SECONDS: "5"
    # BFF pods have no fixed address, so the API trusts the pod network; every forwarded client
    # address must still carry the BFF's signature. k3s default pod CIDR:
    NEXUS_AUTH_PROXY_PEERS: '["10.42.0.0/16"]'
  worker:
    NEXUS_DB_POOL_SIZE: "5"
    NEXUS_DB_MAX_OVERFLOW: "0"
    NEXUS_WORKER_INTERVAL: "5"
    NEXUS_WORKER_HEARTBEAT_TTL: "30"
    # Fallback poll; the quiet window and maximum delay are publication.cluster_defaults policy.
    NEXUS_AUTO_PUBLISH_POLL_SECONDS: "30"
  migrate:
    # Fail on a busy table instead of queueing traffic behind the lock (docs/operations.md).
    NEXUS_MIGRATION_LOCK_TIMEOUT_MS: "5000"
    NEXUS_MIGRATION_STATEMENT_TIMEOUT_MS: "0"
  web:
    # Traefik overwrites X-Real-Ip with the client address it accepted the connection from.
    NEXUS_WEB_CLIENT_IP_HEADER: x-real-ip
    NEXUS_COOKIE_SECURE: "true"
  relay:
    NEXUS_RELAY_LOG: info
    # Database connections per node for requests. Keep relay.replicas x POOL_SIZE within 2-4x the
    # PostgreSQL cores: requests of one hot organization serialize on its lock, so more sessions
    # only queue (docs/relay-acceptance.md#推荐的默认参数). 8 suits up to ~16 nodes on an 8-16 core
    # database; use 2 for 64 nodes. Each node also holds one refresh connection of its own, so it
    # uses POOL_SIZE + 1 of the database's max_connections (nexus-data postgresql.parameters).
    NEXUS_RELAY_POOL_SIZE: "8"
    # Cluster-wide: how many requests of one organization may be inside the database admission at
    # once, across all nodes (0 disables). Others wait in the node for up to ADMISSION_WAIT_MS,
    # then get 429. A platform admission_concurrency quota policy overrides it per organization.
    NEXUS_RELAY_TENANT_ADMISSIONS: "32"
    NEXUS_RELAY_ADMISSION_WAIT_MS: "5000"
    NEXUS_RELAY_CONCURRENCY: "128"
    NEXUS_RELAY_LEASE_MS: "15000"
    NEXUS_RELAY_REQUEST_BYTES: "2097152"
    NEXUS_RELAY_RESPONSE_BYTES: "8388608"
    NEXUS_RELAY_EVENT_BYTES: "1048576"
    NEXUS_RELAY_STREAM_IDLE_MS: "30000"
    NEXUS_RELAY_WS_SESSIONS: "128"
    NEXUS_RELAY_PURGE_INTERVAL_MS: "60000"
    # Per-node fairness caps (each node counts on its own; not cluster-wide quotas).
    NEXUS_RELAY_REQUESTS_PER_TENANT: "32"
    NEXUS_RELAY_STREAMS_PER_TENANT: "8"
    NEXUS_RELAY_WS_SESSIONS_PER_TENANT: "16"
    NEXUS_RELAY_WS_TURNS_PER_TENANT: "16"

# ---------------------------------------------------------------------------------------------
# Layer 3: business policy. Lives in the module policy tables; the console (Platform -> Settings)
# and the /api/v1/settings/* endpoints edit it. Groups listed here are written by
# `nexus settings import --file` in a pre-install/pre-upgrade Job right after the migration
# (docs/operations.md#策略文件导入). Each group's values have the shape of its PUT request body;
# fields left out keep their database value. Groups not listed are untouched.
#   initial  written only while the group was never changed (version 1); afterwards the console
#            is authoritative and later deploys do not overwrite it. Also unlocks the group.
#   managed  written on every deploy and locked: the console shows the group read-only and the
#            API answers 409 policy_managed_externally.
# Groups: identity.site_policy, identity.auth_policy, billing.policy, reporting.export_policy,
# catalog.quota_defaults, publication.cluster_defaults. identity.site_policy holds the site name,
# console URL and contact email; whether setup is complete cannot be imported. Per-cluster and per-organization overrides are runtime data and
# are not part of the file.
# ---------------------------------------------------------------------------------------------
policy:
  enabled: true
  # Report the changes without writing them (the Job log shows the plan).
  dryRun: false
  groups: {}
  # Example:
  #   billing.policy:
  #     mode: initial
  #     values: {currency: USD}
  #   publication.cluster_defaults:
  #     mode: managed
  #     values: {relay: {max_attempts: 3}}

# ---------------------------------------------------------------------------------------------
# Workloads
# ---------------------------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

api:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 384Mi}
    limits: {memory: 1Gi}
  terminationGracePeriodSeconds: 30
  # Lets Traefik stop routing to the pod before uvicorn closes its listener.
  preStopSeconds: 5
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  # Every Worker task claims rows with FOR UPDATE SKIP LOCKED or a database lease, so several
  # replicas are safe; each uses its pod name as NEXUS_WORKER_ID. Settlement locks one wallet
  # per transaction: replicas settle different wallets in parallel, and one fails over for
  # another at once (docs/operations.md#结算-worker). Watch the ready settlement jobs before
  # adding more; one busy wallet is settled by one replica at a time.
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 384Mi}
    limits: {memory: 1Gi}
  terminationGracePeriodSeconds: 60
  nodeSelector: {}
  tolerations: []
  affinity: {}

web:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {memory: 512Mi}
  terminationGracePeriodSeconds: 30
  preStopSeconds: 5
  nodeSelector: {}
  tolerations: []
  affinity: {}

relay:
  # UUID returned by POST /api/v1/gateway-clusters. Leave replicas at 0 until it exists.
  clusterId: ""
  replicas: 0
  # Highest number of nodes this release may ever run. Every pod lists this many optional
  # credential slots, so scaling below it never changes the pod template (no rolling restart).
  nodeSlots: 16
  # PostgreSQL login of node N is "<rolePrefix><N>"; unique per relay cluster sharing a database.
  rolePrefix: nexus_relay_node_
  # Registered with each principal; must cover what the published snapshots require.
  capabilities:
    - reservation.v1
    - usage-events.v1
    - relay.native.v1
    - relay.provider-features.v1
    - relay.sse.v1
    - relay.responses-ws.v1
    # Required once a cluster policy or resource limit differs from the relay's built-in values.
    - relay.cluster-policy.v1
  # Optional ConfigMap with an extra PEM CA for upstreams behind a private CA; mounted as a file
  # and passed as NEXUS_RELAY_UPSTREAM_CA. It is added to, not substituted for, public roots.
  upstreamCA:
    configMap: ""
    key: ca.crt
  # Rolling update and scale-in: Traefik stops routing to the pod during preStop, then SIGTERM
  # starts the drain. Open SSE streams and WebSocket turns may run for drainSeconds, completion
  # reports for up to 90 s more. The grace period is derived from these unless set.
  preStopSeconds: 15
  drainSeconds: 120
  terminationGracePeriodSeconds: null
  resources:
    requests: {cpu: 500m, memory: 256Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Spread nodes over k3s hosts once there is more than one.
  topologySpread: true

hooks:
  # Jobs: provision-database and migrate (pre-install/pre-upgrade), relay nodes (pre and post),
  # policy import (post-install/post-upgrade).
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

# ---------------------------------------------------------------------------------------------
# Network policy (k3s enforces NetworkPolicy with its embedded kube-router controller)
# ---------------------------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Where Traefik runs.
  ingressController:
    namespace: kube-system
    podLabels:
      app.kubernetes.io/name: traefik
  # Prometheus may scrape the relay metrics port (9464) and the API. Empty: nobody can.
  monitoring:
    namespaceLabels: {}
    podLabels: {}
  # Restrict the BFF's egress to the API and DNS.
  restrictWebEgress: true

serviceMonitor:
  # Render a Prometheus Operator ServiceMonitor for the relay metrics port.
  enabled: false
  interval: 30s
