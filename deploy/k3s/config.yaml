# /etc/rancher/k3s/config.yaml for the first (and initially only) server.
# See docs/deployment.md#单节点安装. Copy it, fill in the S3 settings, then run the installer.
#
# Embedded etcd from day one: a single server can later be joined by two more servers for
# control-plane HA, and by any number of agents for capacity, without a datastore migration.
cluster-init: true
# Encrypt Secrets at rest in etcd (aescbc by default; `k3s secrets-encrypt` rotates the key).
secrets-encryption: true
write-kubeconfig-mode: "0600"
# Address clients and future servers use to reach this API server.
# tls-san:
#   - k3s.example.internal
# node-ip: 10.0.0.10

# Scheduled etcd snapshots, kept locally and uploaded to Cloudflare R2: the backup bucket,
# under etcd/<folder>, next to the PostgreSQL backups under postgres/. k3s prunes both the local
# and the R2 copies down to etcd-snapshot-retention (28 x 6 h = 7 days).
# A snapshot contains every Secret. They are encrypted with the secrets-encryption key, which a
# restore needs as well: back up the server token and
# /var/lib/rancher/k3s/server/cred/encryption-config.json outside the cluster.
etcd-snapshot-schedule-cron: "0 */6 * * *"
etcd-snapshot-retention: 28
etcd-snapshot-compress: true
etcd-s3: true
# <account_id>.r2.cloudflarestorage.com (no scheme), or <account_id>.eu.r2.cloudflarestorage.com
# for a bucket in the EU jurisdiction.
etcd-s3-endpoint: ACCOUNT_ID.r2.cloudflarestorage.com
etcd-s3-region: auto
etcd-s3-bucket: nexus-backups
etcd-s3-folder: etcd/production
# Credentials of the backup bucket's R2 API token (Object Read & Write on that bucket only):
# either here (keep this file 0600), or in the Secret named by etcd-s3-config-secret in
# kube-system. Keep an offline copy too: a restore onto a new host happens before the cluster
# and its Secrets exist.
# etcd-s3-access-key: ...
# etcd-s3-secret-key: ...

# Kubelet: reserve room for the OS and k3s itself on a node that also runs PostgreSQL.
kubelet-arg:
  - "system-reserved=cpu=500m,memory=1Gi"
  - "kube-reserved=cpu=500m,memory=1Gi"
  - "eviction-hard=memory.available<500Mi,nodefs.available<10%"
