[project]
name = "nexus-control-plane"
version = "0.1.0"
description = "Nexus enterprise AI API control plane"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.17,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=46,<51",
  "fastapi>=0.120,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2.12,<4",
  "pydantic-settings>=2.11,<3",
  "pynacl>=1.6.2",
  "redis>=6,<8",
  "sqlalchemy[asyncio]>=2.0.44,<3",
  "uvicorn>=0.38,<1",
  "uvloop>=0.22,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[project.scripts]
nexus = "nexus.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "nexus/migrations"
"alembic.ini" = "nexus/alembic.ini"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires the isolated PostgreSQL and Redis test services",
  "capacity: timed control-plane load profiles",
]
addopts = "-ra --strict-markers"
