[package]
name = "nexus-relay"
version = "0.1.0"
edition = "2024"
description = "Nexus relay protocol and data-plane control client"
publish = false

[dependencies]
base64 = "0.22"
crypto_box = { version = "0.9.1", features = ["seal"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "json", "uuid"] }
thiserror = "2"
tiktoken-rs = "0.12.1"
uuid = { version = "1", features = ["serde"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
